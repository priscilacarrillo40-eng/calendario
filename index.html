<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Institucional Compartido Mundialmente</title>

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',

          }

      }
    }
  </script>

  <!-- React 18, ReactDOM 18, Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Supabase JS Client v2 CDN -->

      font-family: 'Inter', sans-serif;

<body class="bg-slate-50 min-h-screen text-slate-800 antialiased selection:bg-brand-500 selection:text-white">

  <!-- Contenedor Principal React -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // Componente de Iconos SVG dinámicos sin librerías externas
    function Icon({ name, className = "w-4 h-4" }) {
      const icons = {
        calendar: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        ),
        clock: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        ),
        school: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0l3-3m-3 3l-3-3"></path>
          </svg>
        ),
        plus: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
          </svg>
        ),
        x: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        ),
        edit: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
          </svg>
        ),
        trash: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
          </svg>
        ),
        palette: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
          </svg>
        ),
        database: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path>
          </svg>
        ),
        globe: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path>
          </svg>
        ),
        alertTriangle: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
        ),
        stickyNote: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
        ),
        code: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
          </svg>
        ),
        chevronLeft: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path>
          </svg>
        ),
        chevronRight: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path>
          </svg>
        ),
        search: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        ),
        refresh: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        ),
        check: (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path>
          </svg>
        )
      };
      return icons[name] || null;
    }

    // Categorías por defecto
    const CATEGORIAS_DEFAULT = {
      reunion: { id: 'reunion', nombre: 'Reunión Directiva', hex: '#2563eb' },
      academico: { id: 'academico', nombre: 'Actividad Académica', hex: '#059669' },
      evaluacion: { id: 'evaluacion', nombre: 'Evaluaciones / Mesas', hex: '#d97706' },
      feriado: { id: 'feriado', nombre: 'Feriado / Asueto', hex: '#dc2626' },
      otro: { id: 'otro', nombre: 'Otro Evento', hex: '#7c3aed' }
    };

    const MESES = [
      'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
      'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
    ];

    const DIAS_SEMANA = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

    // Formatear Date a cadena YYYY-MM-DD
    const formatDateKey = (date) => {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    function App() {
      // Estado de Supabase (Carga inicial desde localStorage)
      const [supabaseUrl, setSupabaseUrl] = useState(() => localStorage.getItem('supabase_url') || '');
      const [supabaseAnonKey, setSupabaseAnonKey] = useState(() => localStorage.getItem('supabase_anon_key') || '');
      
      const [supabaseClient, setSupabaseClient] = useState(null);
      const [syncStatus, setSyncStatus] = useState('offline'); // 'online', 'syncing', 'offline', 'error'
      const [mensajeSync, setMensajeSync] = useState('Modo Local (Configura Supabase para Red Mundial)');

      // Estado de Datos
      const [eventos, setEventos] = useState([]);
      const [categoriasMap, setCategoriasMap] = useState(CATEGORIAS_DEFAULT);
      const [notasRapidas, setNotasRapidas] = useState('');

      // Estado Navegación Calendario
      const [currentDate, setCurrentDate] = useState(new Date());
      const [vistaModo, setVistaModo] = useState('mes'); // 'mes' o 'lista'
      
      // Filtros
      const [busqueda, setBusqueda] = useState('');
      const [filtroCategoria, setFiltroCategoria] = useState('todas');

      // Modales
      const [modalNuevoAbierto, setModalNuevoAbierto] = useState(false);
      const [eventoEditar, setEventoEditar] = useState(null);
      const [eventoSeleccionado, setEventoSeleccionado] = useState(null);
      const [modalColoresAbierto, setModalColoresAbierto] = useState(false);
      const [modalConfigAbierto, setModalConfigAbierto] = useState(false);
      const [modalSqlAbierto, setModalSqlAbierto] = useState(false);
      const [eventoAEliminar, setEventoAEliminar] = useState(null);

      // Inicializar cliente Supabase si existen URL y Key
      useEffect(() => {
        if (supabaseUrl && supabaseAnonKey && window.supabase) {
          try {
            const client = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
            setSupabaseClient(client);
            setSyncStatus('syncing');
            setMensajeSync('Conectando con la Red Mundial...');
          } catch (err) {
            console.error("Error iniciando Supabase:", err);
            setSyncStatus('error');
            setMensajeSync('Error de Credenciales Supabase');
          }
        } else {
          setSupabaseClient(null);
          setSyncStatus('offline');
          setMensajeSync('Modo Local (Sin sincronización mundial)');
        }
      }, [supabaseUrl, supabaseAnonKey]);

      // Función para cargar datos de Supabase
      const cargarDatosSupabase = useCallback(async () => {
        if (!supabaseClient) return;

        setSyncStatus('syncing');
        try {
          // Cargar Eventos
          const { data: dataEvs, error: errEvs } = await supabaseClient.from('eventos').select('*');
          if (errEvs) throw errEvs;

          if (dataEvs) {
            const evsFormateados = dataEvs.map(e => ({
              id: e.id,
              titulo: e.titulo,
              fecha: e.fecha,
              horaInicio: e.hora_inicio || '',
              horaFin: e.hora_fin || '',
              jornadaCompleta: e.jornada_completa || false,
              categoria: e.categoria || 'otro',
              ubicacion: e.ubicacion || '',
              descripcion: e.descripcion || '',
              importante: e.importante || false
            }));
            setEventos(evsFormateados);
          }

          // Cargar Categorías
          const { data: dataCats, error: errCats } = await supabaseClient.from('categorias').select('*');
          if (errCats) throw errCats;

          if (dataCats && dataCats.length > 0) {
            const catMapObj = { ...CATEGORIAS_DEFAULT };
            dataCats.forEach(c => {
              catMapObj[c.id] = { id: c.id, nombre: c.nombre, hex: c.hex };
            });
            setCategoriasMap(catMapObj);
          }

          // Cargar Notas Rápidas
          const { data: dataNotas } = await supabaseClient.from('notas').select('*').eq('id', 'nota_principal').single();
          if (dataNotas) {
            setNotasRapidas(dataNotas.contenido || '');
          }

          setSyncStatus('online');
          setMensajeSync('Sincronizado en Tiempo Real con la Red Mundial');
        } catch (err) {
          console.error("Error al sincronizar datos:", err);
          setSyncStatus('error');
          setMensajeSync('Error de Red/Tabla. Revisa la consola o configuración');
        }
      }, [supabaseClient]);

      // Efecto para Cargar Inicialmente y Suscribirse en Tiempo Real
      useEffect(() => {
        if (!supabaseClient) {
          // Cargar datos locales de respaldo si no hay Supabase
          const localEvs = localStorage.getItem('local_eventos');
          if (localEvs) setEventos(JSON.parse(localEvs));
          const localNotas = localStorage.getItem('local_notas');
          if (localNotas) setNotasRapidas(localNotas);
          return;
        }

        cargarDatosSupabase();

        // Suscripción Realtime a Cambios Mundiales
        const canalEventos = supabaseClient
          .channel('public-realtime-changes')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'eventos' }, () => {
            cargarDatosSupabase();
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'categorias' }, () => {
            cargarDatosSupabase();
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'notas' }, () => {
            cargarDatosSupabase();
          })
          .subscribe();

        return () => {
          supabaseClient.removeChannel(canalEventos);
        };
      }, [supabaseClient, cargarDatosSupabase]);

      // Guardar localmente cuando no hay Supabase
      useEffect(() => {
        if (!supabaseClient) {
          localStorage.setItem('local_eventos', JSON.stringify(eventos));
        }
      }, [eventos, supabaseClient]);

      // Guardar o Editar Evento
      const handleGuardarEvento = async (eventoData, nuevaCategoriaRapida) => {
        let catFinal = eventoData.categoria;

        // Si creó una categoría al vuelo
        if (nuevaCategoriaRapida) {
          const newCatId = 'cat-' + Date.now();
          const objNuevaCat = { id: newCatId, nombre: nuevaCategoriaRapida.nombre, hex: nuevaCategoriaRapida.hex };
          const mapActualizado = { ...categoriasMap, [newCatId]: objNuevaCat };
          setCategoriasMap(mapActualizado);
          catFinal = newCatId;

          if (supabaseClient) {
            try {
              await supabaseClient.from('categorias').upsert({
                id: newCatId,
                nombre: objNuevaCat.nombre,
                hex: objNuevaCat.hex
              });
            } catch (err) {
              console.error("Error guardando categoría:", err);
            }
          }
        }

        const idEvento = eventoData.id || 'ev-' + Date.now();
        const eventoFinal = {
          ...eventoData,
          id: idEvento,
          categoria: catFinal
        };

        // Actualizar Estado Local de inmediato
        setEventos(prev => {
          const existe = prev.some(e => e.id === idEvento);
          if (existe) {
            return prev.map(e => e.id === idEvento ? eventoFinal : e);
          } else {
            return [...prev, eventoFinal];
          }
        });

        setModalNuevoAbierto(false);
        setEventoEditar(null);

        // Sincronizar con Supabase en la Nube Global
        if (supabaseClient) {
          try {
            await supabaseClient.from('eventos').upsert({
              id: idEvento,
              titulo: eventoFinal.titulo,
              fecha: eventoFinal.fecha,
              hora_inicio: eventoFinal.horaInicio,
              hora_fin: eventoFinal.horaFin,
              jornada_completa: eventoFinal.jornadaCompleta,
              categoria: eventoFinal.categoria,
              ubicacion: eventoFinal.ubicacion,
              descripcion: eventoFinal.descripcion,
              importante: eventoFinal.importante
            });
            setSyncStatus('online');
          } catch (err) {
            console.error("Error en Supabase al guardar evento:", err);
            alert("No se pudo enviar a la red mundial. Revisa la conexión y las políticas RLS.");
          }
        }
      };

      // Eliminar Evento
      const handleEliminarEvento = async () => {
        if (!eventoAEliminar) return;

        const id = eventoAEliminar.id;
        setEventos(prev => prev.filter(e => e.id !== id));
        setEventoAEliminar(null);
        setEventoSeleccionado(null);

        if (supabaseClient) {
          try {
            await supabaseClient.from('eventos').delete().eq('id', id);
          } catch (err) {
            console.error("Error eliminando evento en Supabase:", err);
          }
        }
      };

      // Guardar Notas Rápidas
      const handleNotasChange = async (texto) => {
        setNotasRapidas(texto);
        if (!supabaseClient) {
          localStorage.setItem('local_notas', texto);
          return;
        }

        try {
          await supabaseClient.from('notas').upsert({
            id: 'nota_principal',
            contenido: texto,
            updated_at: new Date().toISOString()
          });
        } catch (err) {
          console.error("Error guardando nota rápida:", err);
        }
      };

      // Conectar Supabase desde Modal
      const guardarCredencialesSupabase = (e) => {
        e.preventDefault();
        const urlLimpia = supabaseUrl.trim();
        const keyLimpia = supabaseAnonKey.trim();

        localStorage.setItem('supabase_url', urlLimpia);
        localStorage.setItem('supabase_anon_key', keyLimpia);

        setSupabaseUrl(urlLimpia);
        setSupabaseAnonKey(keyLimpia);
        setModalConfigAbierto(false);
      };

      const desactivarSupabase = () => {
        localStorage.removeItem('supabase_url');
        localStorage.removeItem('supabase_anon_key');
        setSupabaseUrl('');
        setSupabaseAnonKey('');
        setSupabaseClient(null);
        setModalConfigAbierto(false);
      };

      // Navegación de Fecha
      const mesAnterior = () => {
        setCurrentDate(prev => new Date(prev.getFullYear(), prev.getMonth() - 1, 1));
      };
      const mesSiguiente = () => {
        setCurrentDate(prev => new Date(prev.getFullYear(), prev.getMonth() + 1, 1));
      };
      const irAHoy = () => {
        setCurrentDate(new Date());
      };

      // Matriz de Días para el Calendario Mensual
      const diasCalendario = useMemo(() => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        // Primer día del mes
        const primerDiaMes = new Date(year, month, 1);
        // Último día del mes
        const ultimoDiaMes = new Date(year, month + 1, 0);

        // Día de la semana del primer día (0: Domingo, 1: Lunes...)
        let diaSemanaInicio = primerDiaMes.getDay(); // 0-6
        // Ajustar para que Lunes sea 0 y Domingo 6
        diaSemanaInicio = diaSemanaInicio === 0 ? 6 : diaSemanaInicio - 1;

        const dias = [];

        // Días padding del mes anterior
        const diaAnterior = new Date(year, month, 0);
        const diasMesAnterior = diaAnterior.getDate();

        for (let i = diaSemanaInicio - 1; i >= 0; i--) {
          const f = new Date(year, month - 1, diasMesAnterior - i);
          dias.push({ fecha: f, esMesActual: false });
        }

        // Días del mes actual
        for (let i = 1; i <= ultimoDiaMes.getDate(); i++) {
          const f = new Date(year, month, i);
          dias.push({ fecha: f, esMesActual: true });
        }

        // Días padding del mes siguiente para completar múltiplos de 7
        const totalPuntos = dias.length;
        const faltantes = (7 - (totalPuntos % 7)) % 7;
        for (let i = 1; i <= faltantes; i++) {
          const f = new Date(year, month + 1, i);
          dias.push({ fecha: f, esMesActual: false });
        }

        return dias;
      }, [currentDate]);

      // Eventos Filtrados por búsqueda y categoría
      const eventosFiltrados = useMemo(() => {
        return eventos.filter(ev => {
          const coincideCat = filtroCategoria === 'todas' || ev.categoria === filtroCategoria;
          const texto = `${ev.titulo} ${ev.descripcion || ''} ${ev.ubicacion || ''}`.toLowerCase();
          const coincideBusqueda = texto.includes(busqueda.toLowerCase().trim());
          return coincideCat && coincideBusqueda;
        });
      }, [eventos, filtroCategoria, busqueda]);

      // Próximos eventos (ordenados a partir de hoy)
      const proximosEventos = useMemo(() => {
        const hoyKey = formatDateKey(new Date());
        return eventos
          .filter(e => e.fecha >= hoyKey)
          .sort((a, b) => a.fecha.localeCompare(b.fecha))
          .slice(0, 5);
      }, [eventos]);

      // Eventos marcados como importantes
      const eventosImportantes = useMemo(() => {
        return eventos
          .filter(e => e.importante)
          .sort((a, b) => a.fecha.localeCompare(b.fecha));
      }, [eventos]);

      return (

  categoria TEXT DEFAULT 'otro',

  descripcion TEXT,
  importante BOOLEAN DEFAULT false
);

-- 2. Tabla de Categorías
CREATE TABLE IF NOT EXISTS categorias (
  id TEXT PRIMARY KEY,
  nombre TEXT NOT NULL,
  hex TEXT NOT NULL
);

-- 3. Tabla de Notas Compartidas
CREATE TABLE IF NOT EXISTS notas (
  id TEXT PRIMARY KEY,
  contenido TEXT,
  updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

-- 4. Habilitar Seguridad RLS con políticas públicas
ALTER TABLE eventos ENABLE ROW LEVEL SECURITY;
ALTER TABLE categorias ENABLE ROW LEVEL SECURITY;
ALTER TABLE notas ENABLE ROW LEVEL SECURITY;

CREATE POLICY "Acceso total a eventos" ON eventos FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "Acceso total a categorias" ON categorias FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "Acceso total a notas" ON notas FOR ALL USING (true) WITH CHECK (true);`}
                </pre>
              </div>
            </div>
          )}

          {/* MODAL CONFIRMAR ELIMINACIÓN */}
          {eventoAEliminar && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-center">
                <div className="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto">
                  <Icon name="alertTriangle" className="w-6 h-6" />
                </div>
                <h3 className="text-base font-bold text-slate-900">¿Eliminar este evento?</h3>
                <p className="text-xs text-slate-500">
                  Se borrará permanentemente "{eventoAEliminar.titulo}". Esta acción se sincronizará en todos los dispositivos conectados en el mundo.
                </p>
                <div className="flex items-center justify-center space-x-2 pt-2">
                  <button 
                    onClick={() => setEventoAEliminar(null)}
                    className="px-4 py-2 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition"
                  >
                    Cancelar
                  </button>
                  <button 
                    onClick={handleEliminarEvento}
                    className="px-4 py-2 text-xs font-semibold bg-red-600 hover:bg-red-700 text-white rounded-xl shadow-md transition"
                  >
                    Sí, Eliminar
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    /* COMPONENTE MODAL: FORMULARIO CREAR / EDITAR EVENTO */
    function FormularioEventoModal({ eventoEditar, categoriasMap, onGuardar, onCerrar }) {
      const [titulo, setTitulo] = useState(eventoEditar?.titulo || '');
      const [fecha, setFecha] = useState(eventoEditar?.fecha || formatDateKey(new Date()));
      const [jornadaCompleta, setJornadaCompleta] = useState(eventoEditar?.jornadaCompleta ?? false);
      const [horaInicio, setHoraInicio] = useState(eventoEditar?.horaInicio || '08:00');
      const [horaFin, setHoraFin] = useState(eventoEditar?.horaFin || '12:00');
      const [categoria, setCategoria] = useState(eventoEditar?.categoria || Object.keys(categoriasMap)[0] || 'otro');
      const [ubicacion, setUbicacion] = useState(eventoEditar?.ubicacion || '');
      const [descripcion, setDescripcion] = useState(eventoEditar?.descripcion || '');
      const [importante, setImportante] = useState(eventoEditar?.importante ?? false);

      // Estado para nueva categoría opcional
      const [crearCatNueva, setCrearCatNueva] = useState(false);
      const [nombreNuevaCat, setNombreNuevaCat] = useState('');
      const [hexNuevaCat, setHexNuevaCat] = useState('#3b82f6');

      const handleSubmit = (e) => {
        e.preventDefault();
        let catObjetoNuevo = null;
        if (crearCatNueva && nombreNuevaCat.trim()) {
          catObjetoNuevo = { nombre: nombreNuevaCat.trim(), hex: hexNuevaCat };
        }

        onGuardar({
          id: eventoEditar?.id,
          titulo,
          fecha,
          jornadaCompleta,
          horaInicio: jornadaCompleta ? '' : horaInicio,
          horaFin: jornadaCompleta ? '' : horaFin,
          categoria,
          ubicacion,
          descripcion,
          importante
        }, catObjetoNuevo);
      };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <h3 className="text-base font-bold text-slate-900">
                {eventoEditar?.id ? 'Editar Evento' : 'Nuevo Evento Institucional'}
              </h3>
              <button onClick={onCerrar} className="text-slate-400 hover:text-slate-600">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Título del Evento *</label>
                <input 
                  type="text" 
                  value={titulo} 
                  onChange={(e) => setTitulo(e.target.value)}
                  required 
                  placeholder="Ej. Reunión de Equipo Directivo"
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Fecha *</label>
                  <input 
                    type="date" 
                    value={fecha} 
                    onChange={(e) => setFecha(e.target.value)}
                    required 
                    className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500"
                  />
                </div>

                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Categoría</label>
                  <select 
                    value={categoria} 
                    onChange={(e) => setCategoria(e.target.value)}
                    className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500"
                  >
                    {Object.keys(categoriasMap).map(k => (
                      <option key={k} value={k}>{categoriasMap[k].nombre}</option>
                    ))}
                  </select>
                </div>
              </div>

              {/* OPCIÓN DE CATEGORÍA NUEVA EN EL MOMENTO */}
              {!crearCatNueva ? (
                <button 
                  type="button" 
                  onClick={() => setCrearCatNueva(true)}
                  className="text-[11px] text-brand-600 hover:underline font-semibold flex items-center gap-1"
                >
                  <Icon name="plus" className="w-3.5 h-3.5" /> + Crear una nueva categoría rápida
                </button>
              ) : (
                <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="font-bold text-slate-700">Nueva Categoría</span>
                    <button type="button" onClick={() => setCrearCatNueva(false)} className="text-slate-400">
                      <Icon name="x" className="w-3.5 h-3.5" />
                    </button>
                  </div>
                  <div className="flex items-center gap-2">
                    <input 
                      type="text" 
                      placeholder="Nombre de Categoría" 
                      value={nombreNuevaCat}
                      onChange={(e) => setNombreNuevaCat(e.target.value)}
                      className="flex-1 px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg"
                    />
                    <input 
                      type="color" 
                      value={hexNuevaCat}
                      onChange={(e) => setHexNuevaCat(e.target.value)}
                      className="w-8 h-8 rounded-lg cursor-pointer border-0"
                    />
                  </div>
                </div>
              )}

              <div className="flex items-center space-x-2 pt-1">
                <input 
                  type="checkbox" 
                  id="chkJornada" 
                  checked={jornadaCompleta} 
                  onChange={(e) => setJornadaCompleta(e.target.checked)}
                  className="rounded text-brand-600 focus:ring-brand-500"
                />
                <label htmlFor="chkJornada" className="font-semibold text-slate-700 cursor-pointer">
                  Jornada Completa / Sin Hora Fija
                </label>
              </div>

              {!jornadaCompleta && (
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Hora Inicio</label>
                    <input 
                      type="time" 
                      value={horaInicio} 
                      onChange={(e) => setHoraInicio(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500"
                    />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Hora Fin</label>
                    <input 
                      type="time" 
                      value={horaFin} 
                      onChange={(e) => setHoraFin(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500"
                    />
                  </div>
                </div>
              )}

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Ubicación / Aula / Lugar</label>
                <input 
                  type="text" 
                  value={ubicacion} 
                  onChange={(e) => setUbicacion(e.target.value)}
                  placeholder="Ej. Salón de Actos, Zoom, Aula 4"
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Detalles / Observaciones</label>
                <textarea 
                  value={descripcion} 
                  onChange={(e) => setDescripcion(e.target.value)}
                  placeholder="Detalles pedagógicos o administrativos..."
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl h-20 resize-none focus:ring-2 focus:ring-brand-500"
                />
              </div>

              <div className="flex items-center space-x-2 pt-1">
                <input 
                  type="checkbox" 
                  id="chkImp" 
                  checked={importante} 
                  onChange={(e) => setImportante(e.target.checked)}
                  className="rounded text-amber-500 focus:ring-amber-400"
                />
                <label htmlFor="chkImp" className="font-semibold text-amber-800 cursor-pointer flex items-center gap-1">
                  ★ Marcar como Fecha Clave / Prioritaria
                </label>
              </div>

              <div className="flex items-center justify-end space-x-2 pt-3 border-t border-slate-100">
                <button 
                  type="button" 
                  onClick={onCerrar}
                  className="px-4 py-2 font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition"
                >
                  Cancelar
                </button>
                <button 
                  type="submit" 
                  className="px-5 py-2 font-semibold bg-brand-600 hover:bg-brand-700 text-white rounded-xl shadow-md transition"
                >
                  Guardar Evento
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    /* COMPONENTE MODAL: ADMINISTRAR CATEGORÍAS */
    function ModalCategorias({ categoriasMap, setCategoriasMap, supabaseClient, onCerrar }) {
      const [nombreCat, setNombreCat] = useState('');
      const [colorHex, setColorHex] = useState('#2563eb');

      const handleAgregar = async (e) => {
        e.preventDefault();
        if (!nombreCat.trim()) return;

        const newId = 'cat-' + Date.now();
        const nuevaCat = { id: newId, nombre: nombreCat.trim(), hex: colorHex };

        const nuevoMap = { ...categoriasMap, [newId]: nuevaCat };
        setCategoriasMap(nuevoMap);

        if (supabaseClient) {
          try {
            await supabaseClient.from('categorias').upsert({ id: newId, nombre: nuevaCat.nombre, hex: nuevaCat.hex });
          } catch (err) {
            console.error("Error guardando categoría en Supabase:", err);
          }
        }

        setNombreCat('');
      };

      const handleEliminar = async (catId) => {
        const nuevoMap = { ...categoriasMap };
        delete nuevoMap[catId];
        setCategoriasMap(nuevoMap);

        if (supabaseClient) {
          try {
            await supabaseClient.from('categorias').delete().eq('id', catId);
          } catch (err) {
            console.error("Error borrando categoría en Supabase:", err);
          }
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <h3 className="text-base font-bold text-slate-900">Gestión de Categorías e Identificadores</h3>
              <button onClick={onCerrar} className="text-slate-400 hover:text-slate-600">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            {/* Crear Nueva */}
            <form onSubmit={handleAgregar} className="flex items-center gap-2">
              <input 
                type="text" 
                placeholder="Nombre de categoría"
                value={nombreCat}
                onChange={(e) => setNombreCat(e.target.value)}
                required
                className="flex-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-brand-500"
              />
              <input 
                type="color" 
                value={colorHex}
                onChange={(e) => setColorHex(e.target.value)}
                className="w-9 h-9 rounded-xl cursor-pointer border-0"
              />
              <button 
                type="submit" 
                className="px-3 py-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs rounded-xl shadow-xs transition"
              >
                Añadir
              </button>
            </form>

            {/* Lista Existente */}
            <div className="space-y-2 max-h-60 overflow-y-auto pt-2">
              {Object.keys(categoriasMap).map(key => {
                const cat = categoriasMap[key];
                return (
                  <div key={key} className="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-200">
                    <div className="flex items-center space-x-2">
                      <span className="w-4 h-4 rounded-full" style={{ backgroundColor: cat.hex }} />
                      <span className="text-xs font-semibold text-slate-800">{cat.nombre}</span>
                    </div>
                    <button 
                      onClick={() => handleEliminar(key)}
                      className="text-slate-400 hover:text-red-600 p-1 transition"
                      title="Eliminar categoría"
                    >
                      <Icon name="trash" className="w-4 h-4" />
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // Renderizar App en el DOM
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
